name: 매일 아침 블로그 글

on:
  schedule:
    - cron: "10 20 * * *"   # 한국 시간 매일 오전 5시 10분 (깃허브가 최대 1시간쯤 늦게 시작해도 아침 7시 전에 끝나요)
  workflow_dispatch:         # Actions 화면에서 "Run workflow" 버튼으로 바로 실행

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 주제 선정 · 글 작성 · 사진 준비
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          # 실패하면 새 주제로 최대 3번까지 다시 시도해요
          for i in 1 2 3; do
            python -u auto_blog.py prepare && break
            echo "다시 시도 ($i/3)"; sleep 60
          done
          test -f out/post.json

      - name: 사진을 저장소에 올리기
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add images || true
          git diff --cached --quiet || git commit -m "사진 추가 $(date +%F)"
          git push

      - name: 블로거에 게시
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python -u auto_blog.py publish

      - name: 쓴 주제 기록 저장
        run: |
          git add used_topics.json
          git diff --cached --quiet || git commit -m "주제 기록 $(date +%F)"
          git push
